name: Orbit v5.8.5 Whale Footprint History (Research Only)

on:
  schedule:
    # Best-effort every 5min; GitHub schedule can be delayed or skipped.
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run first; record stores anonymous public market data"
        type: choice
        options:
          - dry_run
          - record
        default: dry_run
        required: true

permissions:
  contents: write # Only orbit-whale-history branch via GitHub Contents API.

concurrency:
  group: orbit-whale-history-v585
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Checkout Orbit
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor_requirements.txt
      - name: Install public market dependencies
        run: python -m pip install -r monitor_requirements.txt
      - name: Dry-run (no write)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry_run' }}
        run: python -m whale_runner --dry-run
      - name: Collect / persist public anonymous footprints
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'record' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m whale_runner --record
