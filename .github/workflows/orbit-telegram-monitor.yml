name: Orbit Telegram Signal Monitor

on:
  schedule:
    # Run every 15 minutes, 2 minutes after candle close
    - cron: "2,17,32,47 * * * *"

  workflow_dispatch:
    inputs:
      send_test:
        description: "Send one Telegram TEST message (no trading signal)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: orbit-telegram-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout Orbit code
        uses: actions/checkout@v4

      - name: Python 3.12 with cached dependencies
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: monitor_requirements.txt

      - name: Install monitor dependencies
        run: python -m pip install -r monitor_requirements.txt

      - name: Validate monitor settings
        env:
          ORBIT_WATCH_LINKS: ${{ secrets.ORBIT_WATCH_LINKS }}
        run: python -m alert_monitor --validate-config

      - name: Send one safe TEST message
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m alert_monitor --test-telegram

      - name: Scan PEPE BTC DOGE and notify changes
        if: ${{ github.event_name == 'schedule' || !inputs.send_test }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ORBIT_WATCH_LINKS: ${{ secrets.ORBIT_WATCH_LINKS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m alert_monitor
